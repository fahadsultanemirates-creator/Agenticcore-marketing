name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor declared in pyproject.toml.
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # The suite runs entirely against EchoLLMClient and fakes, so no
      # credentials are needed. Blanking the keys keeps it that way: if a
      # test ever starts reaching for a real backend, it fails here rather
      # than silently passing on someone's machine.
      - name: Run tests
        env:
          ANTHROPIC_API_KEY: ""
          AYRSHARE_API_KEY: ""
          TELEGRAM_BOT_TOKEN: ""
        run: pytest -q

      - name: Check the offline example still runs
        run: python examples/run_campaign.py --dry-run > /dev/null
